name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  online-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund playwright && npx playwright install --with-deps chromium
      - name: Verify online workflow before publishing
        env:
          VITE_SUPABASE_URL: https://online-smoke.supabase.co
          VITE_SUPABASE_ANON_KEY: smoke-public-key
        run: |
          npm run dev -- --host 127.0.0.1 --port 4174 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/online-browser-smoke.mjs
  database-validation:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: tournament_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tournament_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci-only@127.0.0.1:5432/tournament_ci
      ONLINE_SQL_FIXTURES: /tmp/online-sql-fixtures.jsonl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Apply migrations to disposable PostgreSQL
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/ci_auth_stub.sql
          for file in supabase/migrations/*.sql; do psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f "$file"; done
      - name: SQL permissions, revisions and sport guards
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/online_revision_api.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/online_scoring.sql
      - name: Generate and replay actual director states
        run: |
          npx vitest run tests/remoteTournamentStorage.test.ts
          node scripts/replay-online-sql-fixtures.mjs
      - name: Concurrent capability reads on disposable PostgreSQL
        run: node scripts/online-read-load.mjs

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, online-validation, database-validation]
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
